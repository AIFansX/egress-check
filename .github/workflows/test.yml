name: Shell regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TEST_REAL_MTR: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y jq gawk mawk busybox shellcheck mtr-tiny
      - run: bash -n ip.sh && shellcheck --severity=warning ip.sh
      - run: python3 tests/test_regression.py
      - name: Legacy awk (no interval expressions)
        run: |
          curl -fsSL https://invisible-island.net/archives/mawk/mawk-1.3.4-20200120.tgz -o /tmp/mawk.tgz
          mkdir /tmp/old-mawk-build
          tar -xzf /tmp/mawk.tgz -C /tmp/old-mawk-build --strip-components=1
          cd /tmp/old-mawk-build
          ./configure && make -j2
          sudo install -m 755 mawk /usr/local/bin/old-mawk
          cd "$GITHUB_WORKSPACE"
          python3 tests/test_regression.py
      - name: Bash 4.2 compatibility
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/bash/bash-4.2.tar.gz -o /tmp/bash.tgz
          tar -xzf /tmp/bash.tgz -C /tmp
          cd /tmp/bash-4.2
          ./configure --without-bash-malloc && make -j2
          cd "$GITHUB_WORKSPACE"
          TEST_BASH=/tmp/bash-4.2/bash python3 tests/test_regression.py
  alpine:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - run: apk add --no-cache bash python3 jq coreutils procps git
      - uses: actions/checkout@v4
      - run: bash -n ip.sh && python3 tests/test_regression.py
